# Vultr instance 2: self-hosted LiveKit with its own TURN server.
# Self-hosting here (rather than LiveKit Cloud) is the point: the sponsor evidence
# is media infrastructure running on Vultr.
#
# Signalling listens on plain HTTP here on purpose. Caddy (see compose.media.yml)
# terminates TLS for rtc.<domain> on 443 and proxies to this port over loopback, so
# 7880 must NOT be open in the firewall.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # Required on a cloud VM so LiveKit advertises the public address, not the
  # private one it sees on its own interface.
  use_external_ip: true

turn:
  enabled: true
  domain: ${TURN_DOMAIN}
  tls_port: 5349
  udp_port: 3478
  # The same certbot certificate Caddy uses; it covers rtc.<domain> and turn.<domain>.
  # A self-signed certificate is rejected by browsers and TURN over TLS fails silently.
  cert_file: /etc/livekit/certs/live/aftercare/fullchain.pem
  key_file: /etc/livekit/certs/live/aftercare/privkey.pem

keys:
  # Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in the app's .env.
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info
